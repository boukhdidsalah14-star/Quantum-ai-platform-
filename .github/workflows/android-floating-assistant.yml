name: QUANTUM AI Android floating assistant build

on:
  push:
    branches:
      - feature/quantum-ai-redesign-2026
    paths:
      - "android/**"
      - ".github/workflows/android-floating-assistant.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        run: |
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build Android debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload installable beta APK
        uses: actions/upload-artifact@v4
        with:
          name: quantum-ai-floating-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
