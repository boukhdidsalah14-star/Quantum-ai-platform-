name: QUANTUM AI Android QA APK and public download

on:
  push:
    branches:
      - quantum-ai-commercial-launch-2026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install compile SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android QA APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload QA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantum-ai-android-qa
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable Android QA build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-qa-latest
          name: QUANTUM AI Android — QA build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Android QA build for testing only.
            This APK is debug-signed and is not the final commercially signed release.
            Do not use for real-money trading.
