name: QUANTUM AI Step 2 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [step2-analysis-preserve-workspaces]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Run pytest suite
        run: python -m pytest -q tests
      - name: Run Deriv demo safety suite
        run: python -m unittest discover -s tests -p 'test_deriv_trading.py' -v
