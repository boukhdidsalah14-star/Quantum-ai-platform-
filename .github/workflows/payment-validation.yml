name: Payment system validation

on:
  pull_request:
    branches:
      - feature/quantum-ai-redesign-2026
    paths:
      - "app/main.py"
      - "app/subscriptions.py"
      - "static/app.js"
      - "static/index.html"
      - "tests/test_subscriptions.py"
      - ".github/workflows/payment-validation.yml"
  push:
    branches:
      - feature/payment-system-completion-preview-2026-11-15

permissions:
  contents: read

jobs:
  payment-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run subscription payment tests
        env:
          QUANTUM_PERSISTENT_STORAGE: "false"
        run: python -m pytest tests/test_subscriptions.py -q
      - name: Run complete regression suite
        run: PYTHONPATH=. python -m pytest -q
