name: Build QUANTUM AI Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-quantum-ai-apk.yml'
  push:
    branches: [main, feature/quantum-ai-android-subscriptions]
    paths:
      - 'android/**'
      - '.github/workflows/build-quantum-ai-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Prepare customer beta APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk quantum-ai-android-beta.apk
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantum-ai-android-beta
          path: quantum-ai-android-beta.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public beta release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quantum-ai-android-beta-${{ github.run_number }}
          name: QUANTUM AI Android Beta ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: quantum-ai-android-beta.apk
          body: |
            QUANTUM AI Android beta build.

            This APK is debug-signed for testing and direct installation. It is not a production signing key or a Google Play release. Do not use this build for real-money trading. Broker execution availability depends on the specific verified integration and server configuration.

            Download only if you trust this beta build.
