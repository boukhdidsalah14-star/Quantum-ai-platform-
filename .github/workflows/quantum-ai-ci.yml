name: QUANTUM AI validation

on:
  push:
    branches:
      - feature/advanced-market-analysis
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend JavaScript syntax
        run: |
          node --check static/auto-trading.js
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          for index, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as file:
                  file.write(script)
                  file.flush()
                  subprocess.run(["node", "--check", file.name], check=True)
          print("Inline JavaScript syntax checks passed.")
          PY

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run test suite
        run: python -m pytest -q

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android beta APK
        run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-ai-android-1.0.2-beta
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
